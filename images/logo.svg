<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#08090E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>

  <!-- Outer Crest Ring -->
  <circle cx="256" cy="256" r="226" fill="#141722" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Shield Base -->
  <path d="M 256 70 C 340 70 410 110 410 230 C 410 330 330 400 256 440 C 182 400 102 330 102 230 C 102 110 172 70 256 70 Z" fill="url(#shieldGrad)" stroke="#F59E0B" stroke-width="6"/>

  <!-- Flame Motif Behind Crown -->
  <path d="M 256 100 C 270 140 310 160 300 200 C 290 230 270 240 256 220 C 242 240 222 230 212 200 C 202 160 242 140 256 100 Z" fill="#FBBF24" opacity="0.85"/>
  <path d="M 256 130 C 265 155 285 170 280 195 C 275 210 265 215 256 205 C 247 215 237 210 232 195 C 227 170 247 155 256 130 Z" fill="#FFFBEB"/>

  <!-- Fried Chicken Drumstick Icon -->
  <g transform="translate(196, 175) scale(0.6)" filter="url(#glow)">
    <!-- Bone -->
    <path d="M 170 220 L 220 270 C 230 280 230 295 220 305 C 210 315 195 315 185 305 L 175 295 C 165 305 150 305 140 295 C 130 285 130 270 140 260 L 150 250 Z" fill="#F3F4F6"/>
    <!-- Crispy Drumstick Meat -->
    <path d="M 50 140 C 20 80 80 20 140 40 C 190 55 210 110 195 160 C 185 195 150 215 125 210 C 95 205 65 180 50 140 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="4"/>
    <!-- Crunchy Texture Dots -->
    <circle cx="90" cy="80" r="5" fill="#D97706"/>
    <circle cx="120" cy="70" r="7" fill="#FDE68A"/>
    <circle cx="145" cy="110" r="6" fill="#B45309"/>
    <circle cx="85" cy="130" r="8" fill="#FBBF24"/>
    <circle cx="125" cy="150" r="6" fill="#D97706"/>
    <circle cx="160" cy="150" r="5" fill="#FDE68A"/>
  </g>

  <!-- Big Bold Typography: LFC -->
  <text x="256" y="340" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="94" fill="#FFFFFF" letter-spacing="4" stroke="#08090E" stroke-width="4">LFC</text>
  <text x="256" y="340" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="94" fill="url(#goldGrad)" letter-spacing="4">LFC</text>

  <!-- Banner Ribbon for LAHORE -->
  <path d="M 90 355 L 422 355 L 400 395 L 370 385 L 256 390 L 142 385 L 112 395 Z" fill="#08090E" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="377" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#FBBF24" letter-spacing="6">LAHORE FRIED CHICKEN</text>

  <!-- Rating Stars -->
  <g fill="#F59E0B" transform="translate(196, 404) scale(0.65)">
    <polygon points="25,2 32,18 49,18 35,29 40,46 25,35 10,46 15,29 1,18 18,18"/>
    <polygon points="75,2 82,18 99,18 85,29 90,46 75,35 60,46 65,29 51,18 68,18"/>
    <polygon points="125,2 132,18 149,18 135,29 140,46 125,35 110,46 115,29 101,18 118,18"/>
    <polygon points="175,2 182,18 199,18 185,29 190,46 175,35 160,46 165,29 151,18 168,18"/>
  </g>
</svg>
