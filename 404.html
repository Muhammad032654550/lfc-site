<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Lahore Fried Chicken (LFC)</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./images/logo.svg" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 50% 0%, #16110a 0%, #08090E 60%);
        color: #F3F4F6;
        padding: 24px;
      }
      .emoji { font-size: 64px; }
      h1 { font-size: 28px; margin: 8px 0; }
      p { color: #9CA3AF; max-width: 420px; margin: 0 auto 24px; }
      a.btn {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 14px;
        font-weight: 800;
        text-decoration: none;
        color: #000;
        background: linear-gradient(90deg, #F59E0B, #FBBF24);
        box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.7);
      }
    </style>
    <script>
      // If this is a deep link, bounce back to the site root so the SPA-style page loads.
      (function () {
        var path = window.location.pathname;
        // Only redirect once (avoid loops) and only for paths under the site root.
        if (path && !/\/(index\.html)?$/.test(path)) {
          // Let users read the 404 briefly, then offer/perform a redirect.
          setTimeout(function () {
            window.location.replace('./');
          }, 1200);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="emoji">🍗</div>
      <h1>This page slipped off the menu</h1>
      <p>We couldn't find that page, but our crispy chicken is right where you left it.</p>
      <a class="btn" href="./">Back to LFC Home</a>
    </main>
  </body>
</html>
